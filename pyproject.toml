[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pckgs"
version = "0.0.1"
description = "Create automation scripts that involve reading, preprocessing, and training the data."
authors = [
  { name = "Omar Khadrawy" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["pckgs"]
include = ["pyproject.toml", "pckgs/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["pckgs"]
force-sort-within-sections = true

